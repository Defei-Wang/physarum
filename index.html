<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physarum Polycephalum Morphogenesis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0e12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #161822;
      border-bottom: 1px solid #272a38;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 16px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .nav-tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }
    .tag-btn {
      background: #232738;
      color: #94a3b8;
      border: 1px solid #33394d;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }
    .tag-btn:hover {
      background: #2e344a;
      color: #f1f5f9;
    }
    .tag-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #60a5fa;
    }
    #viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
      background: #000000;
    }
    .status {
      font-size: 12px;
      color: #64748b;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Physarum Polycephalum</h1>
      <span id="api-status" class="status">Loading tags...</span>
    </div>
    <div class="nav-tags" id="tag-container">
      <!-- 默认静态保底按钮 -->
      <button class="tag-btn active" onclick="loadVersion('v1.html', this)">v1.0</button>
      <button class="tag-btn" onclick="loadVersion('v2.html', this)">v2.0</button>
    </div>
  </header>

  <iframe id="viewport" src="v1.html"></iframe>

  <script>
    const GITHUB_REPO = "Defei-Wang/physarum";

    function loadVersion(url, btn) {
      document.getElementById('viewport').src = url;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    async function fetchGitHubTags() {
      const statusEl = document.getElementById('api-status');
      const container = document.getElementById('tag-container');

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/tags`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const tags = await res.json();
        
        if (tags && tags.length > 0) {
          container.innerHTML = "";
          // 按照版本自然排序 (如 v1.0, v2.0 ...)
          const sortedTags = tags.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

          sortedTags.forEach((tag, idx) => {
            const btn = document.createElement('button');
            btn.className = `tag-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = tag.name;
            
            // 约定：每个 tag 对应根目录下的同名主版本 html，如 v1.0 -> v1.html
            const majorMatch = tag.name.match(/v(\d+)/i);
            const targetHtml = majorMatch ? `v${majorMatch[1]}.html` : `${tag.name}.html`;
            
            btn.onclick = () => loadVersion(targetHtml, btn);
            container.appendChild(btn);

            if (idx === 0) loadVersion(targetHtml, btn);
          });
          statusEl.innerText = `Synchronized: ${tags.length} tags`;
        }
      } catch (err) {
        statusEl.innerText = `API Rate Limited / Offline (Serving default)`;
      }
    }

    fetchGitHubTags();
  </script>
</body>
</html>
