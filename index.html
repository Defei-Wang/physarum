<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physarum Polycephalum Morphogenesis Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #12141c;
      border-bottom: 1px solid #1e2330;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .nav-tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      align-items: center;
    }
    .tag-btn {
      background: #1e2230;
      color: #94a3b8;
      border: 1px solid #2e3547;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tag-btn:hover {
      background: #282f44;
      color: #f8fafc;
    }
    .tag-btn.active {
      background: #eab308;
      color: #0f172a;
      border-color: #facc15;
      font-weight: 600;
    }
    #viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #030406;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Physarum Simulation Suite</h1>
    </div>
    <div class="nav-tags" id="tag-container">
      <button class="tag-btn" onclick="loadVersion('v1.html', this)">v1.0 Baseline</button>
      <button class="tag-btn" onclick="loadVersion('v2.html', this)">v2.0 Archival</button>
      <button class="tag-btn" onclick="loadVersion('v3.html', this)">v3.0 Space Graph</button>
      <button class="tag-btn" onclick="loadVersion('v3.1.html', this)">v3.1 Tokyo Railway</button>
      <button class="tag-btn" onclick="loadVersion('v4.html', this)">v4.0 Ping-Pong</button>
      <button class="tag-btn" onclick="loadVersion('v5.html', this)">v5.0 Antagonism</button>
      <button class="tag-btn active" onclick="loadVersion('v6.html', this)">v6.0 Flagship</button>
    </div>
  </header>

  <iframe id="viewport" src="v6.html"></iframe>

  <script>
    function loadVersion(url, btn) {
      document.getElementById('viewport').src = url;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
