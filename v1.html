<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Physarum v1.0 - Multi-Cluster & Shuttle Streaming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08090c;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 600px;
      height: 600px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid #1e293b;
      background: #0d0e12;
    }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
      backdrop-filter: blur(4px);
      user-select: none;
    }
    .hud-panel b { color: #facc15; font-size: 12px; }
    .btn {
      margin-top: 6px;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="hud-panel">
    <b>Physarum v1.0 (True Baseline)</b><br>
    初值: 三簇萌发接种 (左下/右上/中心)<br>
    边界: 矩形刚性壁反射 (非圆盘)<br>
    节律: 穿梭流行波调制 (Shuttle Wave)<br>
    操作: [鼠标左键] 投放燕麦粒并注气味<br>
    <button class="btn" onclick="initSimulation()">重置并重新接种 (R)</button>
  </div>
</div>

<script>
const RES = 600;
const N = 50000;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const imgData = ctx.createImageData(RES, RES);
const buf32 = new Uint32Array(imgData.data.buffer);

let trail = new Float32Array(RES * RES);
let nextTrail = new Float32Array(RES * RES);
let scent = new Float32Array(RES * RES);
let nextScent = new Float32Array(RES * RES);

const px = new Float32Array(N);
const py = new Float32Array(N);
const th = new Float32Array(N);

const foods = [];
for (let i = 0; i < 16; i++) foods.push({ x: 0, y: 0, energy: 0 });
let foodPtr = 0;

const SO = 22.5 * Math.PI / 180.0;
const SA = 45.0 * Math.PI / 180.0;
const SS = 3.5;
const DEP = 4.0;
const TRAIL_DECAY = 0.94;
const DIFFUSE_RATE = 0.15;

function initSimulation() {
  trail.fill(0);
  scent.fill(0);
  for (let i = 0; i < 16; i++) foods[i].energy = 0;
  foodPtr = 0;

  const cx = RES * 0.5, cy = RES * 0.5;
  for (let i = 0; i < N; i++) {
    const cluster = Math.random();
    let bx = cx, by = cy;
    if (cluster < 0.33) {
      bx -= 100.0; by -= 35.0;
    } else if (cluster < 0.66) {
      bx += 100.0; by += 35.0;
    }
    const r = Math.sqrt(Math.random()) * 40.0;
    const theta = Math.random() * Math.PI * 2.0;
    px[i] = bx + Math.cos(theta) * r;
    py[i] = by + Math.sin(theta) * r;
    th[i] = theta + (Math.random() - 0.5) * 0.8;
  }
}

function sampleField(x, y, angle) {
  const sx = (x + Math.cos(angle) * SS) | 0;
  const sy = (y + Math.sin(angle) * SS) | 0;
  if (sx > 0 && sx < RES - 1 && sy > 0 && sy < RES - 1) {
    const idx = sy * RES + sx;
    return trail[idx] + scent[idx] * 30.0;
  }
  return 0.0;
}

let t = 0.0;
function step() {
  t += 0.04;
  const streamDir = Math.sin(t * 0.15) > 0 ? 1.0 : -1.0;

  for (let i = 0; i < N; i++) {
    let x = px[i], y = py[i], angle = th[i];

    let isFeeding = false;
    for (let f = 0; f < 16; f++) {
      if (foods[f].energy > 0) {
        const dx = foods[f].x - x, dy = foods[f].y - y;
        if (dx * dx + dy * dy < 64.0) {
          isFeeding = true;
          foods[f].energy -= 0.005;
        }
      }
    }

    const fwd = sampleField(x, y, angle);
    const left = sampleField(x, y, angle - SO);
    const right = sampleField(x, y, angle + SO);

    if (fwd > left && fwd > right) {}
    else if (fwd < left && fwd < right) angle += (Math.random() < 0.5 ? SA : -SA);
    else if (left > right) angle -= SA;
    else if (right > left) angle += SA;

    angle += (Math.random() - 0.5) * 0.15;

    const flowPulse = Math.sin(t * 2.0 - (x + y) * 0.015 * streamDir);
    let speed = 1.0;
    let deposit = DEP;

    if (isFeeding) {
      speed = 0.05;
      deposit = DEP * (2.5 + flowPulse * 1.5);
    } else {
      deposit = DEP * (0.8 + flowPulse * 0.3);
    }

    x += Math.cos(angle) * speed;
    y += Math.sin(angle) * speed;

    if (x < 2.0 || x >= RES - 2.0 || y < 2.0 || y >= RES - 2.0) {
      x = Math.max(2.0, Math.min(RES - 2.1, x));
      y = Math.max(2.0, Math.min(RES - 2.1, y));
      angle = Math.random() * Math.PI * 2.0;
    }

    px[i] = x; py[i] = y; th[i] = angle;
    trail[(y | 0) * RES + (x | 0)] += deposit;
  }

  for (let y = 1; y < RES - 1; y++) {
    const y0 = y * RES, ym1 = (y - 1) * RES, yp1 = (y + 1) * RES;
    for (let x = 1; x < RES - 1; x++) {
      const idx = y0 + x;
      const blurred = trail[idx] * (1.0 - DIFFUSE_RATE) +
        (trail[idx - 1] + trail[idx + 1] + trail[ym1 + x] + trail[yp1 + x]) * (DIFFUSE_RATE * 0.25);
      nextTrail[idx] = blurred * TRAIL_DECAY;

      const sBlurred = scent[idx] * 0.7 +
        (scent[idx - 1] + scent[idx + 1] + scent[ym1 + x] + scent[yp1 + x]) * 0.075;
      nextScent[idx] = sBlurred * 0.992;
    }
  }
  trail.set(nextTrail);
  scent.set(nextScent);

  for (let y = 0; y < RES; y++) {
    const row = y * RES;
    for (let x = 0; x < RES; x++) {
      const idx = row + x;
      const val = trail[idx];
      let r = 13, g = 15, b = 14;

      if (val >= 0.08) {
        const fringe = Math.min(1.0, val * 0.08);
        const core = Math.pow(Math.min(1.0, val * 0.03), 3.0);
        r = Math.min(255, (r + (fringe * 0.65 + core * 0.35) * 255) | 0);
        g = Math.min(255, (g + (fringe * 0.75 + core * 0.25) * 255) | 0);
        b = Math.min(255, Math.max(0, (b + (fringe * 0.45 - core * 0.25) * 255) | 0));
      }

      for (let f = 0; f < 16; f++) {
        if (foods[f].energy > 0) {
          const dx = foods[f].x - x, dy = foods[f].y - y;
          if (dx * dx + dy * dy < 49.0) {
            const alpha = Math.min(0.85, foods[f].energy / 1500.0);
            r = (r * (1.0 - alpha) + 200 * alpha) | 0;
            g = (g * (1.0 - alpha) + 185 * alpha) | 0;
            b = (b * (1.0 - alpha) + 150 * alpha) | 0;
          }
        }
      }

      buf32[idx] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  requestAnimationFrame(step);
}

cv.addEventListener('mousedown', (e) => {
  const rect = cv.getBoundingClientRect();
  const x = ((e.clientX - rect.left) * (RES / rect.width)) | 0;
  const y = ((e.clientY - rect.top) * (RES / rect.height)) | 0;
  foods[foodPtr % 16] = { x, y, energy: 2500.0 };
  scent[y * RES + x] += 800.0;
  foodPtr++;
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') initSimulation();
});

initSimulation();
requestAnimationFrame(step);
</script>
</body>
</html>
