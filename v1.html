<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Physarum v1.0 - Baseline Dense Swarm & Shuttle Streaming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050608;
      color: #94a3b8;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      width: 700px;
      height: 700px;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      border-radius: 50%;
      border: 2px solid #1e293b;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 20px;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .hud b { color: #38bdf8; }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="simCanvas" width="600" height="600"></canvas>
  <div class="hud">
    <b>Physarum Engine v1.0</b><br>
    Model: Jones (2010) + Shuttle Streaming<br>
    Agents: 50,000 | SO: 22.5° | SA: 45°<br>
    Decay: 0.94 | Traveling Wave Modulated<br>
    [R]: 重置基底质点池
  </div>
</div>

<script>
const RES = 600;
const N_AGENTS = 50000;
const CENTER_X = RES / 2.0;
const CENTER_Y = RES / 2.0;
const RADIUS = RES / 2.0 - 4.0;

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(RES, RES);
const buf32 = new Uint32Array(imgData.data.buffer);

let trail = new Float32Array(RES * RES);
let trailNew = new Float32Array(RES * RES);

const posX = new Float32Array(N_AGENTS);
const posY = new Float32Array(N_AGENTS);
const heading = new Float32Array(N_AGENTS);

function initSim() {
  trail.fill(0);
  trailNew.fill(0);
  for (let i = 0; i < N_AGENTS; i++) {
    const ang = Math.random() * Math.PI * 2.0;
    const r = Math.sqrt(Math.random()) * (RADIUS - 20.0);
    posX[i] = CENTER_X + Math.cos(ang) * r;
    posY[i] = CENTER_Y + Math.sin(ang) * r;
    heading[i] = ang + Math.PI * 0.5;
  }
}

function sampleField(x, y) {
  const ix = (x + RES) % RES | 0;
  const iy = (y + RES) % RES | 0;
  return trail[iy * RES + ix];
}

const SO = 9.0;
const SA = 0.3927; // 22.5 度
const RA = 0.7854; // 45.0 度
const BASE_SPEED = 2.0;
let stepCount = 0;

function stepSimulation() {
  stepCount++;
  const omega = 0.04;
  const kx = 0.015;
  const ky = 0.015;

  for (let i = 0; i < N_AGENTS; i++) {
    let pX = posX[i];
    let pY = posY[i];
    let h = heading[i];

    // 穿梭流行波调制步长与沉积
    const wave = Math.sin(omega * stepCount - (kx * pX + ky * pY));
    const speed = BASE_SPEED * (1.0 + 0.35 * wave);
    const deposit = 5.0 * (1.0 + 0.5 * wave);

    const fX = pX + Math.cos(h) * SO;
    const fY = pY + Math.sin(h) * SO;
    const lX = pX + Math.cos(h + SA) * SO;
    const lY = pY + Math.sin(h + SA) * SO;
    const rX = pX + Math.cos(h - SA) * SO;
    const rY = pY + Math.sin(h - SA) * SO;

    const Fv = sampleField(fX, fY);
    const Lv = sampleField(lX, lY);
    const Rv = sampleField(rX, rY);

    if (Fv > Lv && Fv > Rv) {
      // 保持原方向
    } else if (Fv < Lv && Fv < Rv) {
      h += (Math.random() < 0.5) ? RA : -RA;
    } else if (Lv < Rv) {
      h -= RA;
    } else if (Rv < Lv) {
      h += RA;
    }

    h += (Math.random() - 0.5) * 0.15;
    pX += Math.cos(h) * speed;
    pY += Math.sin(h) * speed;

    // 圆形刚性边界环形回绕/反弹
    const relX = pX - CENTER_X;
    const relY = pY - CENTER_Y;
    const dist = Math.hypot(relX, relY);
    if (dist > RADIUS) {
      const nx = relX / dist;
      const ny = relY / dist;
      const dot = Math.cos(h) * nx + Math.sin(h) * ny;
      h = Math.atan2(Math.sin(h) - 2.0 * dot * ny, Math.cos(h) - 2.0 * dot * nx);
      pX = CENTER_X + nx * (RADIUS - 2.0);
      pY = CENTER_Y + ny * (RADIUS - 2.0);
    }

    posX[i] = pX;
    posY[i] = pY;
    heading[i] = h;

    const ix = pX | 0;
    const iy = pY | 0;
    if (ix >= 0 && ix < RES && iy >= 0 && iy < RES) {
      trail[iy * RES + ix] += deposit;
    }
  }

  // 3x3 空间滤波与 0.94 衰减
  const decayFactor = 0.94;
  for (let y = 0; y < RES; y++) {
    const ym1 = (y > 0 ? y - 1 : 0) * RES;
    const y0 = y * RES;
    const yp1 = (y < RES - 1 ? y + 1 : RES - 1) * RES;

    for (let x = 0; x < RES; x++) {
      const xm1 = x > 0 ? x - 1 : 0;
      const xp1 = x < RES - 1 ? x + 1 : RES - 1;

      const s = trail[ym1 + xm1] + trail[ym1 + x] + trail[ym1 + xp1] +
                trail[y0 + xm1]  + trail[y0 + x]  + trail[y0 + xp1] +
                trail[yp1 + xm1] + trail[yp1 + x] + trail[yp1 + xp1];

      trailNew[y0 + x] = (s / 9.0) * decayFactor;
    }
  }
  trail.set(trailNew);

  // 渲染荧光黄绿调色板
  for (let i = 0; i < RES * RES; i++) {
    const val = Math.min(255, trail[i] * 1.5) | 0;
    if (val === 0) {
      buf32[i] = 0xff080605;
    } else {
      const r = (val * 0.45) | 0;
      const g = (val * 0.95) | 0;
      const b = (val * 0.25) | 0;
      buf32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  requestAnimationFrame(stepSimulation);
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') initSim();
});

initSim();
requestAnimationFrame(stepSimulation);
</script>
</body>
</html>
