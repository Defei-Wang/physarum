<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Physarum v6.0 - Blind Foraging & Retrograde Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050608;
      color: #cbd5e1;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      width: 700px;
      height: 700px;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      border-radius: 50%;
      border: 2px solid #1e293b;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 20px;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .hud b { color: #facc15; }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="simCanvas" width="600" height="600"></canvas>
  <div class="hud">
    <b>Physarum Engine v6.0</b><br>
    Agents: 80,000 (Lagrangian)<br>
    [LMB]: 投放燕麦粒 (48px 局域嗅探)<br>
    [R]: 重置基底与粒子池
  </div>
</div>

<script>
const RES = 600;
const N_AGENTS = 80000;
const MAX_FOODS = 32;
const CENTER_X = RES / 2.0;
const CENTER_Y = RES / 2.0;
const RADIUS = RES / 2.0 - 4.0;
const CAP = 5.0;

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(RES, RES);
const buf32 = new Uint32Array(imgData.data.buffer);

// 场变量
let trail = new Float32Array(RES * RES);
let trailNew = new Float32Array(RES * RES);

// 质点属性
const posX = new Float32Array(N_AGENTS);
const posY = new Float32Array(N_AGENTS);
const heading = new Float32Array(N_AGENTS);
const state = new Uint8Array(N_AGENTS); // 0: 死, 1: 盲探者, 2: 回流者
const life = new Float32Array(N_AGENTS);
let allocPtr = 0;

// 食物系统: [x, y, energy, active]
const foods = [];
for (let i = 0; i < MAX_FOODS; i++) {
  foods.push({ x: 0, y: 0, energy: 0, active: 0 });
}
let foodCursor = 0;

function initSim() {
  trail.fill(0);
  trailNew.fill(0);
  state.fill(0);
  allocPtr = 0;
  for (let i = 0; i < MAX_FOODS; i++) foods[i].active = 0;
  foodCursor = 0;
}

function pumpCoreAgents() {
  for (let k = 0; k < 600; k++) {
    const idx = allocPtr % N_AGENTS;
    allocPtr++;
    state[idx] = 1; // 探索者
    life[idx] = 450.0;
    const ang = Math.random() * Math.PI * 2.0;
    const r = Math.sqrt(Math.random()) * 14.0;
    posX[idx] = CENTER_X + Math.cos(ang) * r;
    posY[idx] = CENTER_Y + Math.sin(ang) * r;
    heading[idx] = ang + (Math.random() - 0.5) * 1.0;
  }
}

function sampleField(pX, pY) {
  const x = Math.max(0, Math.min(RES - 1.001, pX));
  const y = Math.max(0, Math.min(RES - 1.001, pY));
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 + 1, y1 = y0 + 1;
  const fx = x - x0, fy = y - y0;
  return trail[y0 * RES + x0] * (1 - fx) * (1 - fy) +
         trail[y0 * RES + x1] * fx * (1 - fy) +
         trail[y1 * RES + x0] * (1 - fx) * fy +
         trail[y1 * RES + x1] * fx * fy;
}

function getFoodScent(px, py) {
  let s = 0.0;
  for (let f = 0; f < MAX_FOODS; f++) {
    if (foods[f].active) {
      const dx = px - foods[f].x;
      const dy = py - foods[f].y;
      const dist = Math.hypot(dx, dy);
      if (dist < 48.0) {
        s += 5.0 * (1.0 - dist / 48.0);
      }
    }
  }
  return s;
}

function getOutwardScent(px, py) {
  const dx = px - CENTER_X;
  const dy = py - CENTER_Y;
  return Math.hypot(dx, dy) * 0.022; // 离心破内卷势能
}

function getHomeScent(px, py) {
  const dx = px - CENTER_X;
  const dy = py - CENTER_Y;
  return (800.0 - Math.hypot(dx, dy)) * 0.04; // 向心回流势能
}

const SO = 11.0;
const SA = 0.785; // 45 度
const RA = 0.785;
const SS = 1.35;
const DEP_EXP = 0.06;
const DEP_RET = 1.60;

function stepAgents() {
  for (let i = 0; i < N_AGENTS; i++) {
    const st = state[i];
    if (st === 0) continue;

    life[i] -= 1.0;
    if (life[i] <= 0) {
      state[i] = 0;
      continue;
    }

    let pX = posX[i];
    let pY = posY[i];
    let h = heading[i];

    const cosH = Math.cos(h);
    const sinH = Math.sin(h);

    // 三向探针采样
    const fX = pX + cosH * SO;
    const fY = pY + sinH * SO;

    const lX = pX + Math.cos(h + SA) * SO;
    const lY = pY + Math.sin(h + SA) * SO;

    const rX = pX + Math.cos(h - SA) * SO;
    const rY = pY + Math.sin(h - SA) * SO;

    let Fv = sampleField(fX, fY);
    let Lv = sampleField(lX, lY);
    let Rv = sampleField(rX, rY);

    if (st === 1) {
      Fv = Fv * 0.45 + getOutwardScent(fX, fY) + getFoodScent(fX, fY);
      Lv = Lv * 0.45 + getOutwardScent(lX, lY) + getFoodScent(lX, lY);
      Rv = Rv * 0.45 + getOutwardScent(rX, rY) + getFoodScent(rX, rY);
    } else {
      Fv += getHomeScent(fX, fY);
      Lv += getHomeScent(lX, lY);
      Rv += getHomeScent(rX, rY);
    }

    let turn = 0.0;
    if (Fv > Lv && Fv > Rv) {
      turn = 0.0;
    } else if (Fv < Lv && Fv < Rv) {
      turn = (Math.random() < 0.5) ? RA : -RA;
    } else if (Lv < Rv) {
      turn = -RA;
    } else {
      turn = RA;
    }

    const jitter = (st === 1) ? 0.45 : 0.06;
    turn += (Math.random() - 0.5) * jitter;
    h += turn;

    let pX2 = pX + Math.cos(h) * SS;
    let pY2 = pY + Math.sin(h) * SS;

    // 相变判定 (接触燕麦)
    if (st === 1) {
      for (let f = 0; f < MAX_FOODS; f++) {
        if (foods[f].active) {
          const dx = pX2 - foods[f].x;
          const dy = pY2 - foods[f].y;
          if (dx * dx + dy * dy < 81.0) {
            foods[f].energy -= 0.6;
            if (foods[f].energy <= 0) foods[f].active = 0;

            state[i] = 2; // 跃迁为回流者
            life[i] = 1000.0;
            h += Math.PI + (Math.random() - 0.5) * 0.3; // 180° 反冲
            break;
          }
        }
      }
    } else if (st === 2) {
      const dx = pX2 - CENTER_X;
      const dy = pY2 - CENTER_Y;
      if (dx * dx + dy * dy < 300.0) {
        state[i] = 0; // 回流至中心卸载消亡
        continue;
      }
    }

    // 圆形边界反射
    const relX = pX2 - CENTER_X;
    const relY = pY2 - CENTER_Y;
    const dist = Math.hypot(relX, relY);
    if (dist > RADIUS) {
      const nx = relX / dist;
      const ny = relY / dist;
      const dot = Math.cos(h) * nx + Math.sin(h) * ny;
      const refX = Math.cos(h) - 2.0 * dot * nx;
      const refY = Math.sin(h) - 2.0 * dot * ny;
      h = Math.atan2(refY, refX);
      pX2 = CENTER_X + nx * (RADIUS - 1.0);
      pY2 = CENTER_Y + ny * (RADIUS - 1.0);
      life[i] -= 30.0;
    }

    posX[i] = pX2;
    posY[i] = pY2;
    heading[i] = h;

    const ix = pX2 | 0;
    const iy = pY2 | 0;
    if (ix >= 0 && ix < RES && iy >= 0 && iy < RES) {
      const idx = iy * RES + ix;
      const dep = (st === 1) ? DEP_EXP : DEP_RET;
      // 软截断避免单线塌缩
      const cur = trail[idx];
      trail[idx] = cur + dep * (1.0 - Math.min(1.0, cur / CAP));
    }
  }
}

function diffuseAndDecay() {
  const mix = 0.35;
  const decay = 0.016;

  for (let y = 0; y < RES; y++) {
    const ym1 = (y > 0 ? y - 1 : 0) * RES;
    const y0 = y * RES;
    const yp1 = (y < RES - 1 ? y + 1 : RES - 1) * RES;

    for (let x = 0; x < RES; x++) {
      const xm1 = x > 0 ? x - 1 : 0;
      const xp1 = x < RES - 1 ? x + 1 : RES - 1;

      const s = trail[ym1 + xm1] + trail[ym1 + x] + trail[ym1 + xp1] +
                trail[y0 + xm1]  + trail[y0 + x]  + trail[y0 + xp1] +
                trail[yp1 + xm1] + trail[yp1 + x] + trail[yp1 + xp1];

      const blur = s / 9.0;
      const val = (trail[y0 + x] * (1.0 - mix) + blur * mix) * (1.0 - decay);
      trailNew[y0 + x] = Math.min(val, CAP);
    }
  }
  trail.set(trailNew);
}

function renderRelief() {
  for (let y = 0; y < RES; y++) {
    const y0 = y * RES;
    const ym1 = (y > 0 ? y - 1 : 0) * RES;
    const yp1 = (y < RES - 1 ? y + 1 : RES - 1) * RES;

    for (let x = 0; x < RES; x++) {
      const pIdx = y0 + x;
      const dxRel = x - CENTER_X;
      const dyRel = y - CENTER_Y;
      if (dxRel * dxRel + dyRel * dyRel > RADIUS * RADIUS) {
        buf32[pIdx] = 0xff080605;
        continue;
      }

      const xm1 = x > 0 ? x - 1 : 0;
      const xp1 = x < RES - 1 ? x + 1 : RES - 1;

      const dHdx = (trail[y0 + xp1] - trail[y0 + xm1]) * 0.5;
      const dHdy = (trail[yp1 + x] - trail[ym1 + x]) * 0.5;

      // 法线光照 (平行光来自左上方 [0.4, 0.5, 0.7])
      const nx = -1.8 * dHdx;
      const ny = -1.8 * dHdy;
      const nz = 1.0;
      const invLen = 1.0 / Math.hypot(nx, ny, nz);
      const ndotl = Math.max(0.0, (nx * 0.4 + ny * 0.5 + nz * 0.7) * invLen);

      const v = Math.min(1.0, Math.pow(trail[pIdx] / CAP, 0.6));
      let r = 0, g = 0, b = 0;

      if (v < 0.4) {
        const t = v / 0.4;
        r = 12 * (1 - t) + 45 * t;
        g = 15 * (1 - t) + 85 * t;
        b = 12 * (1 - t) + 18 * t;
      } else {
        const t = (v - 0.4) / 0.6;
        r = 45 * (1 - t) + 250 * t;
        g = 85 * (1 - t) + 235 * t;
        b = 18 * (1 - t) + 60 * t;
      }

      const shade = Math.min(1.4, 0.45 + 0.75 * ndotl);
      r = Math.min(255, (r * shade) | 0);
      g = Math.min(255, (g * shade) | 0);
      b = Math.min(255, (b * shade) | 0);

      // 叠加燕麦高亮
      for (let f = 0; f < MAX_FOODS; f++) {
        if (foods[f].active) {
          const fDist = Math.hypot(x - foods[f].x, y - foods[f].y);
          const rOat = 6.0 * Math.sqrt(foods[f].energy / 500.0);
          if (fDist < rOat) {
            r = (r * 0.2 + 220 * 0.8) | 0;
            g = (g * 0.2 + 205 * 0.8) | 0;
            b = (b * 0.2 + 160 * 0.8) | 0;
          }
        }
      }

      buf32[pIdx] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function loop() {
  pumpCoreAgents();
  stepAgents();
  diffuseAndDecay();
  renderRelief();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = RES / rect.width;
  const scaleY = RES / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;

  const idx = foodCursor % MAX_FOODS;
  foods[idx] = { x: px, y: py, energy: 2800.0, active: 1 };
  foodCursor++;
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    initSim();
  }
});

initSim();
requestAnimationFrame(loop);
</script>
</body>
</html>
