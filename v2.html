<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Physarum v2.0 - Clean Radial Dish & Evaporation Pruning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050608;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 600px;
      height: 600px;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      border: 1px solid #1e293b;
    }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
      backdrop-filter: blur(4px);
      user-select: none;
    }
    .hud-panel b { color: #38bdf8; font-size: 12px; }
    .btn {
      margin-top: 6px;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="hud-panel">
    <b>Physarum v2.0 (Clean Radial)</b><br>
    边界: 培养皿刚性圆盘约束 (半径 0.48)<br>
    动力学: 进食速度减缓至 0.4 (微弱向心偏航)<br>
    挥发: 高蒸发修剪 (Decay Factor: 0.92)<br>
    操作: [鼠标左键] 盘内投放燕麦 (盘外拦截)<br>
    <button class="btn" onclick="initSimulation()">重置培养皿 (R)</button>
  </div>
</div>

<script>
const RES = 600;
const N = 40000;
const CENTER = RES * 0.5;
const MAX_R = RES * 0.48;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const imgData = ctx.createImageData(RES, RES);
const buf32 = new Uint32Array(imgData.data.buffer);

let trail = new Float32Array(RES * RES);
let nextTrail = new Float32Array(RES * RES);
let scent = new Float32Array(RES * RES);
let nextScent = new Float32Array(RES * RES);

const px = new Float32Array(N);
const py = new Float32Array(N);
const th = new Float32Array(N);

const foods = [];
for (let i = 0; i < 16; i++) foods.push({ x: 0, y: 0, energy: 0 });
let foodPtr = 0;

const SENSE_DIST = 6.0;
const SENSE_ANGLE = 0.45;
const TURN_ANGLE = 0.70;
const DECAY_FACTOR = 0.92;

function initSimulation() {
  trail.fill(0);
  scent.fill(0);
  for (let i = 0; i < 16; i++) foods[i].energy = 0;
  foodPtr = 0;

  for (let i = 0; i < N; i++) {
    const r = Math.sqrt(Math.random()) * 12.0;
    const theta = Math.random() * Math.PI * 2.0;
    px[i] = CENTER + Math.cos(theta) * r;
    py[i] = CENTER + Math.sin(theta) * r;
    th[i] = theta + (Math.random() - 0.5) * 0.5;
  }
}

function sampleField(x, y, angle) {
  const sx = (x + Math.cos(angle) * SENSE_DIST) | 0;
  const sy = (y + Math.sin(angle) * SENSE_DIST) | 0;
  if (sx > 0 && sx < RES - 1 && sy > 0 && sy < RES - 1) {
    const idx = sy * RES + sx;
    return trail[idx] + scent[idx] * 200.0;
  }
  return -1.0;
}

function step() {
  for (let f = 0; f < 16; f++) {
    if (foods[f].energy > 0) {
      const fx = foods[f].x | 0, fy = foods[f].y | 0;
      if (fx > 2 && fx < RES - 2 && fy > 2 && fy < RES - 2) {
        scent[fy * RES + fx] += 50.0;
      }
    }
  }

  for (let i = 0; i < N; i++) {
    let x = px[i], y = py[i], angle = th[i];

    let inFood = false;
    for (let f = 0; f < 16; f++) {
      if (foods[f].energy > 0) {
        const dx = foods[f].x - x, dy = foods[f].y - y;
        if (dx * dx + dy * dy < 144.0) {
          inFood = true;
          foods[f].energy -= 0.005;
          const targetAngle = Math.atan2(dy, dx);
          angle = angle * 0.9 + targetAngle * 0.1;
        }
      }
    }

    const fwd = sampleField(x, y, angle);
    const left = sampleField(x, y, angle - SENSE_ANGLE);
    const right = sampleField(x, y, angle + SENSE_ANGLE);

    if (fwd > left && fwd > right) {}
    else if (fwd < left && fwd < right) angle += (Math.random() < 0.5 ? TURN_ANGLE : -TURN_ANGLE);
    else if (left > right) angle -= TURN_ANGLE;
    else if (right > left) angle += TURN_ANGLE;

    angle += (Math.random() - 0.5) * 0.20;

    let speed = 1.2, deposit = 0.8;
    if (inFood) {
      speed = 0.4;
      deposit = 3.5;
    }

    x += Math.cos(angle) * speed;
    y += Math.sin(angle) * speed;

    const distSq = (x - CENTER) ** 2 + (y - CENTER) ** 2;
    if (distSq > MAX_R * MAX_R) {
      angle = Math.atan2(CENTER - y, CENTER - x) + (Math.random() - 0.5);
      x = CENTER + Math.cos(angle) * (MAX_R - 2.0);
      y = CENTER + Math.sin(angle) * (MAX_R - 2.0);
    }

    px[i] = x; py[i] = y; th[i] = angle;
    trail[(y | 0) * RES + (x | 0)] += deposit;
  }

  for (let y = 2; y < RES - 2; y++) {
    const y0 = y * RES, ym1 = (y - 1) * RES, yp1 = (y + 1) * RES;
    for (let x = 2; x < RES - 2; x++) {
      const idx = y0 + x;
      const blurredT = trail[idx] * 0.5 +
        (trail[idx - 1] + trail[idx + 1] + trail[ym1 + x] + trail[yp1 + x]) * 0.125;
      nextTrail[idx] = Math.min(15.0, blurredT * DECAY_FACTOR);

      const blurredS = scent[idx] * 0.4 +
        (scent[idx - 1] + scent[idx + 1] + scent[ym1 + x] + scent[yp1 + x]) * 0.15;
      nextScent[idx] = blurredS * 0.98;
    }
  }
  trail.set(nextTrail);
  scent.set(nextScent);

  for (let y = 0; y < RES; y++) {
    const row = y * RES;
    for (let x = 0; x < RES; x++) {
      const idx = row + x;
      const d = Math.hypot(x - CENTER, y - CENTER);

      if (d > MAX_R) {
        buf32[idx] = 0xff000000;
        continue;
      }

      const val = trail[idx];
      let r = 5, g = 5, b = 10;

      if (val >= 0.1) {
        const intensity = Math.min(1.0, val * 0.4);
        const core = Math.pow(Math.min(1.0, val * 0.2), 3.0);
        r = Math.min(255, (r + (intensity * 0.7 + core * 0.3) * 255) | 0);
        g = Math.min(255, (g + (intensity * 0.8 + core * 0.2) * 255) | 0);
        b = Math.min(255, Math.max(0, (b + (intensity * 0.2 - core * 0.1) * 255) | 0));
      }

      for (let f = 0; f < 16; f++) {
        if (foods[f].energy > 0) {
          const df = Math.hypot(foods[f].x - x, foods[f].y - y);
          if (df < 9.0) {
            const op = Math.min(0.7, foods[f].energy / 2000.0);
            r = (r * (1.0 - op) + 210 * op) | 0;
            g = (g * (1.0 - op) + 190 * op) | 0;
            b = (b * (1.0 - op) + 130 * op) | 0;
          }
        }
      }

      buf32[idx] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  requestAnimationFrame(step);
}

cv.addEventListener('mousedown', (e) => {
  const rect = cv.getBoundingClientRect();
  const x = ((e.clientX - rect.left) * (RES / rect.width)) | 0;
  const y = ((e.clientY - rect.top) * (RES / rect.height)) | 0;
  if (Math.hypot(x - CENTER, y - CENTER) < MAX_R - 10.0) {
    foods[foodPtr % 16] = { x, y, energy: 4000.0 };
    foodPtr++;
  }
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') initSimulation();
});

initSimulation();
requestAnimationFrame(step);
</script>
</body>
</html>
